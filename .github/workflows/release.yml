name: Release and deploy

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      action:
        description: Deploy or roll back to an already-published release SHA
        required: true
        type: choice
        options:
          - deploy
          - rollback
      release_sha:
        description: Full 40-character Git SHA of the published release
        required: true
        type: string
      release_ref:
        description: Human-readable release tag or incident reference
        required: true
        type: string
      reason:
        description: Required operational reason for rollback
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/software-oath

jobs:
  verify:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  publish-control-plane:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Build and publish control-plane image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-control-plane:${{ github.ref_name }}
            ${{ env.IMAGE_PREFIX }}-control-plane:sha-${{ github.sha }}
          cache-from: type=gha,scope=release-control-plane
          cache-to: type=gha,mode=max,scope=release-control-plane
      - uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}-control-plane
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  publish-runner:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Build and publish runner image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.runner
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-runner:${{ github.ref_name }}
            ${{ env.IMAGE_PREFIX }}-runner:sha-${{ github.sha }}
          cache-from: type=gha,scope=release-runner
          cache-to: type=gha,mode=max,scope=release-runner
      - uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}-runner
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  deploy-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish-control-plane, publish-runner]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Send protected deployment request
        env:
          DEPLOY_URL: ${{ vars.SOFTWARE_OATH_DEPLOY_URL }}
          DEPLOY_TOKEN: ${{ secrets.SOFTWARE_OATH_DEPLOY_TOKEN }}
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          CONTROL_PLANE_DIGEST: ${{ needs.publish-control-plane.outputs.digest }}
          RUNNER_DIGEST: ${{ needs.publish-runner.outputs.digest }}
          REQUEST_ID: release-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          test -n "$DEPLOY_URL"
          test -n "$DEPLOY_TOKEN"
          jq -n \
            --arg action deploy \
            --arg request_id "$REQUEST_ID" \
            --arg release_ref "$RELEASE_REF" \
            --arg release_sha "$RELEASE_SHA" \
            --arg control_plane "${IMAGE_PREFIX}-control-plane@${CONTROL_PLANE_DIGEST}" \
            --arg runner "${IMAGE_PREFIX}-runner@${RUNNER_DIGEST}" \
            '{action:$action,request_id:$request_id,release_ref:$release_ref,release_sha:$release_sha,images:{control_plane:$control_plane,runner:$runner}}' \
            > deployment.json
          curl --fail-with-body --retry 3 --retry-all-errors \
            --header "Authorization: Bearer $DEPLOY_TOKEN" \
            --header "Idempotency-Key: $REQUEST_ID" \
            --header "Content-Type: application/json" \
            --data-binary @deployment.json \
            "$DEPLOY_URL"

  manual-deployment:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Validate request and resolve immutable image digests
        id: resolve
        env:
          ACTION: ${{ inputs.action }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          REASON: ${{ inputs.reason }}
        run: |
          case "$RELEASE_SHA" in
            *[!0-9a-f]*|'') echo "release_sha must be lowercase hexadecimal" >&2; exit 1 ;;
          esac
          test "${#RELEASE_SHA}" -eq 40
          if test "$ACTION" = rollback; then test -n "$REASON"; fi
          control_plane_digest="$(docker buildx imagetools inspect "${IMAGE_PREFIX}-control-plane:sha-${RELEASE_SHA}" --format '{{.Manifest.Digest}}')"
          runner_digest="$(docker buildx imagetools inspect "${IMAGE_PREFIX}-runner:sha-${RELEASE_SHA}" --format '{{.Manifest.Digest}}')"
          test -n "$control_plane_digest"
          test -n "$runner_digest"
          echo "control_plane_digest=$control_plane_digest" >> "$GITHUB_OUTPUT"
          echo "runner_digest=$runner_digest" >> "$GITHUB_OUTPUT"
      - name: Send protected deployment request
        env:
          DEPLOY_URL: ${{ vars.SOFTWARE_OATH_DEPLOY_URL }}
          DEPLOY_TOKEN: ${{ secrets.SOFTWARE_OATH_DEPLOY_TOKEN }}
          ACTION: ${{ inputs.action }}
          RELEASE_REF: ${{ inputs.release_ref }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          REASON: ${{ inputs.reason }}
          CONTROL_PLANE_DIGEST: ${{ steps.resolve.outputs.control_plane_digest }}
          RUNNER_DIGEST: ${{ steps.resolve.outputs.runner_digest }}
          REQUEST_ID: manual-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          test -n "$DEPLOY_URL"
          test -n "$DEPLOY_TOKEN"
          jq -n \
            --arg action "$ACTION" \
            --arg request_id "$REQUEST_ID" \
            --arg release_ref "$RELEASE_REF" \
            --arg release_sha "$RELEASE_SHA" \
            --arg reason "$REASON" \
            --arg control_plane "${IMAGE_PREFIX}-control-plane@${CONTROL_PLANE_DIGEST}" \
            --arg runner "${IMAGE_PREFIX}-runner@${RUNNER_DIGEST}" \
            '{action:$action,request_id:$request_id,release_ref:$release_ref,release_sha:$release_sha,reason:$reason,images:{control_plane:$control_plane,runner:$runner}}' \
            > deployment.json
          curl --fail-with-body --retry 3 --retry-all-errors \
            --header "Authorization: Bearer $DEPLOY_TOKEN" \
            --header "Idempotency-Key: $REQUEST_ID" \
            --header "Content-Type: application/json" \
            --data-binary @deployment.json \
            "$DEPLOY_URL"
