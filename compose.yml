services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: software_oath
      POSTGRES_USER: software_oath
      POSTGRES_PASSWORD: local-development-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U software_oath"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - software-oath-postgres:/var/lib/postgresql/data

  api:
    build: .
    command: ["node", "--import", "tsx", "scripts/serve.ts"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://software_oath:local-development-only@postgres:5432/software_oath
      SOFTWARE_OATH_ARTIFACT_PATH: /data/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8787:8787"
    volumes:
      - software-oath-artifacts:/data/artifacts

  worker:
    build: .
    command: ["node", "--import", "tsx", "scripts/worker.ts"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://software_oath:local-development-only@postgres:5432/software_oath
      SOFTWARE_OATH_ARTIFACT_PATH: /data/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - software-oath-artifacts:/data/artifacts
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  software-oath-postgres:
  software-oath-artifacts:
